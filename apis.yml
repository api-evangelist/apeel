aid: apeel
name: Apeel
description: >-
  Apeel Sciences is a food technology company headquartered in Santa Barbara, California that develops
  plant-based protective coatings which extend the shelf life of fresh fruits and vegetables. The company
  uses food-grade ingredients derived from the peels, pulp, and seeds of plants to create a thin, edible
  layer that reinforces produce's natural peel, slowing water loss and oxidation. This extends peak taste,
  juiciness, and nutrient retention while reducing reliance on refrigeration, waxes, pesticides, and plastic
  packaging across the fresh-produce supply chain. Apeel positions itself as a sustainability and food-waste
  leader, reporting that since 2021 its technology has prevented millions of pieces of fruit from spoiling,
  avoided tens of thousands of metric tons of CO2-equivalent emissions, and conserved billions of liters of
  water. Its products have undergone regulatory review in the United States, European Union, and other markets.
  Apeel is a portfolio company of Andreessen Horowitz (a16z) and was added to the API Evangelist network as a
  venture-portfolio lead. It publishes no public developer API, developer portal, or machine-readable API
  specification as of this profile.
